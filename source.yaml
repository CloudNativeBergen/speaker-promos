  abstract: At the Norwegian Digitalisation Agency (Digdir), we are exploring Agentgateway, an open-source project, as a shared entry point for accessing LLM providers and MCP servers. This allows us to centrally manage credentials, authentication, rate limits, and observability across models and providers running on-premises and in the cloud. This session covers how Agentgateway handles authentication, model-based routing, rate-limit enforcement, upstream credential injection, and API translation before forwarding requests to the configured provider. Attendees will learn where an AI gateway fits within a cloud-native platform and how it can help platform teams manage access to AI services.
