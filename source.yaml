spec:
  title: 'OpenTelemetry OpAMP for You and Me: The OpAMP Guide We All Desperately Needed'
  abstract: |-
    In 2022, OpenTelemetry (OTel) announced a new network protocol called the Open Agent Management protocol (OpAMP) as a means of managing fleets of data collection agents.

    Among other things, it is VERY well-suited for managing fleets of OTel Collectors. As organizations increase their adoption of OpenTelemetry, they find themselves having to manage not one, not two, not five Collectors, but perhaps tens or even hundreds of them. How do you keep track of all of that? The answer is with OpAMP.

    The thing about OpAMP though, is that, while powerful, it remains confusing and elusive to many, and while it is fairly extensively documented, it’s not exactly easy to understand. There are a few OpAMP tutorials out there, many of which barely scratched the surface. But no longer!

    In this session, you will learn:
    * What is OpAMP, really?
    * OpAMP components
    * Why it's great for managing fleets of Collectors
    * How OpAMP works for OTel Collectors
    * OpAMP, OTel Collectors, and Kubernetes
    * A live demo
    * The future of OpAMP

    But OpAMP documentation is sparse and confusing at best. This session aims to demystify OpAMP and unravel its mysteries, so that attendees have a clear understanding of how it works, the problems it solves, and where it fits into their organization.
