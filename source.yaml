spec:
  title: Platform Obesity, not Complexity, is killing our platforms
  abstract: |-
    We like to say Kubernetes platforms fail because they’re “too complex”. But complexity isn’t the problem. Platforms fail because they’re obese.

    They’re bloated with an excess of features, tools, abstractions, and opinions.

    The cloud-native ecosystem doesn’t help. It rewards addition, not subtraction.

    Eventually, the platform collides with reality: finite talent, finite attention, finite time. Cognitive load exceeds capacity. Operational friction grows. Engineering quality cracks. Business outcomes stall. ROI quietly evaporates.

    So how do you fix an obese platform? The same way you fix obesity: by creating a calorie deficit, rigorous exercise and discipline. Learning to say 'no'. Subtract, not add. Stay within those constraints across technology, processes, organizational culture, budget, engineering skills, team cognitive load and more.

    In this talk, I'll show you concrete ways to learn to say 'no', subtract, all while improving your platform's capabilities.
