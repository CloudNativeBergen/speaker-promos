spec:
  title: Network security isn’t dead — it’s just no longer enough
  abstract: |-
    Cloud-native architectures didn’t remove the need for network security — they changed how it works.

    While identity has become a critical control plane, network-level controls like private endpoints, VNet integration, and segmentation still play an important role in providing visibility and reducing exposure. The problem is that many architectures treat these controls as sufficient on their own.

    In this lightning talk, we’ll explore how modern cloud patterns combine identity and network in ways that create hidden trust relationships, reduced visibility, and unexpected attack paths.

    Through a few practical examples, we’ll look at where network controls still add value, where they fall short, and why security in cloud-native environments depends on understanding how identity and network interact — not choosing one over the other.
