spec:
  title: Observing Kubernetes Policies with Kyverno and VictoriaMetrics
  abstract: |-
    Kubernetes policies are often introduced to improve security and consistency, but once enabled they can be difficult to understand and troubleshoot. When a workload is rejected, teams frequently lack visibility into which policy was evaluated, how often it fails.
    This talk presents a simple, technical workflow for observing Kubernetes policy behavior using Kyverno and VictoriaMetrics. Starting from a single validation policy, we show how policy evaluations and enforcement results are exposed as metrics, ingested into VictoriaMetrics and queried through a standard Prometheus-compatible API. A minimal dashboard is then used to inspect policy failures, affected namespaces and policy execution duration.
    The talk focuses on making policy enforcement observable using standard Kubernetes primitives and open metrics, without assuming prior experience with policy engines or observability systems.
