spec:
  title: Vi bytter ut Terraform med Crossplane. Hvorfor i all verden gjør vi det?
  abstract: |-
    Vekst er bra – helt til det ikke lenger er det. I årevis kom ny funksjonalitet først mens teknisk gjeld hopet seg opp i det stille. Avhengigheter, treg CI/CD, tette koblinger og midlertidige løsninger gjorde det vanskelig å holde alt oppdatert, og plattformens omdømme ble dårligere for hver måned som gikk.

    Dette er historien om hvordan vi havnet her, hvorfor vi bygger om i stedet for å fikse det vi har, og hvordan vi bruker Crossplane til å skape en utvikleropplevelse folk faktisk liker å bruke.

    Det er også historien om alt som ikke er perfekt, utfordringene vi møtte, og hvorfor det å fortjene utviklernes tillit betyr mer enn noen arkitekturbeslutning. Gode verktøy hjelper. Å være åpen om hva som er ødelagt hjelper mer. Å ikke overselge det du bygger hjelper kanskje aller mest. Du kan velge riktig teknologi og likevel ha ingen som bruker det – hvis du ikke lytter.
