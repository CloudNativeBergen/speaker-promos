spec:
  title: 'When Infrastructure Disappears but DNS Remains: A Cloud-Native Security Story'
  abstract: |-
    DNS is one of the most trusted components of modern cloud infrastructure, yet a simple configuration mistake can silently hand control of a subdomain to an attacker. Dangling nameserver delegations are often dismissed as expected DNS behavior, making them difficult to detect and easy to overlook.

    In this talk, we demonstrate how abandoned or misconfigured nameserver delegations can be abused to take over trusted subdomains across major cloud providers. Drawing on research conducted across organizations from various industries and institutions in both the Nordic region and internationally, we show how these issues persist in real-world environments and why they remain a challenge for platform and security teams.

    Attendees will learn how dangling NS delegations occur, what impact they can have on cloud-native architectures, and how to identify and eliminate them before they become a security incident.
