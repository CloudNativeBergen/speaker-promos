spec:
  title: A perspective on platforms and their capabilities
  abstract: |-
    As a platform grows, the centralized platform team becomes a bottleneck. This is often handled by creating a platform team-of-teams, where sub-teams are responsible for capabilities such as observability, databases, storage etc. This transformation can introduce a lot of friction as responsibility of the platform is now split between several teams.

    The CNCF Platform Community has just released a paper where we talk about how platforms and capabilities interact, which addresses this issue in particular. We present some important principles for both the platform and the capability, as well as five concrete factors that capabilities must adhere to in order to behave well in the platform.

    In this talk I'll present this paper, and talk about our work writing it. I will give a birds-eye view of the content, and explain why the perspectives presented are valuable also to small platforms.
