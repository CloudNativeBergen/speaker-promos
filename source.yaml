spec:
  title: 'From Pipelines to Control Planes: Migrating AWS Account Vending from Terraform to KRM'
  abstract: "For years, platform teams have relied on static CI/CD pipelines and Terraform to vend and bootstrap cloud accounts. But as our platform scales to hundreds of accounts, pipelines become the bottleneck: they run slow, they are difficult to evolve, and lack reconciliation when infrastructure drifts.\n\nIn this session, we share our journey from a Terraform driven account provisioning platform to a Kubernetes resource model for vending cloud accounts. \nWe will show how representing cloud accounts and their infrastructure as Kubernetes resources enabled continuous reconciliation, simplified developer self-service, and made our platform easier to extend and operate at scale. \nWhether you are building an internal platform or modernizing existing infrastructure, you’ll leave with ideas for designing Kubernetes-native control planes and adopting the Kubernetes Resource Model."
